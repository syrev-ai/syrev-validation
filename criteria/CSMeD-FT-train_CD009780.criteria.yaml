  question: 'Cochrane review: "Implementation of treatment guidelines for specialist mental health care". Does this record meet the review''s eligible study design? Review criterion: We included randomised controlled trials only. When a trial did not report randomisation but was described as double‐blind, and the demographic details of each group were similar, we considered the study to be randomised. We excluded quasi‐randomised studies, such as those allocated by using alternate days of the week. We included studies that used cluster randomisation (such as randomisation by clinician or practice). We included studies published in all languages.'
  required: true
- id: population
  question: 'Cochrane review: "Implementation of treatment guidelines for specialist mental health care". Does this record study the review''s eligible participants/population? Review criterion: We included adults, however defined, with schizophrenia or related severe mental disorders, including schizophreniform disorder, schizoaffective disorder, and delusional disorder. We omitted studies in non‐adult populations because of the differences in medical decision‐making for children and adolescents, including the parent and guardian role. As we were interested in making sure that information was relevant to the care of individuals with severe mental disorders in specialist settings, we only included studies with participants recruited in mental healthcare settings.'
  required: true
- id: intervention_or_topic
  question: 'Cochrane review: "Implementation of treatment guidelines for specialist mental health care". Does this record evaluate the review''s eligible intervention / exposure / index test / topic? Review criterion: We included any active or passive guideline implementation strategy. We defined guidelines as systematically developed statements (or algorithms, flow charts, or tables), prepared to assist decisions about appropriate health care for specific clinical circumstances. We defined implementation as any planned process and systematic introduction of guidelines with the aim of giving them a structural place in professional practice. We included passive strategies, such as guideline distribution. We classified interventions according to a taxonomy developed by the Cochrane Effective Practice and Organisation of Care Review Group (EPOC). We included the following comparisons. Guideline implementation strategy versus usual care (''no intervention'' control). Guideline implementation strategy A versus guideline implementation strategy B. Guideline implementation strategy versus usual care (''no intervention'' control). Guideline implementation strategy A versus guideline implementation strategy B.'
