  question: 'Cochrane review: "First rank symptoms for schizophrenia". Does this record meet the review''s eligible study design? Review criterion: We included both retrospective and prospective studies, which consecutively or randomly selected participants. We excluded case‐control studies that used healthy controls. Studies were included that evaluated the diagnostic accuracy of First Rank Symptoms (one or multiple) for diagnosis of schizophrenia compared with a reference standard, irrespective of publication status and language.'
  required: true
- id: population
  question: 'Cochrane review: "First rank symptoms for schizophrenia". Does this record study the review''s eligible participants/population? Review criterion: We included adolescents and adults presenting with psychotic symptoms, which included symptoms such as, hallucinations, delusions, disordered thinking and speech, grossly disorganised or catatonic behaviour, or negative symptoms (i.e. affective flattening, alogia, or volition). We did not exclude on the grounds of co‐morbidities. In addition, if a study reported all admissions to a psychiatric ward instead of only people admitted with psychosis, the study, including those participants with non‐psychotic symptoms, was not excluded. We did exclude if participants had organic source of psychosis, such as that triggered by an existent physical disease or alcohol and drug abuse. Particular attention was paid to history, current clinical state (acute, post‐acute or quiescent), stage of illness (prodromal, early, established, late), or if there were predominant clinical issues (negative or positive symptoms). In addition, setting and referral status of people in the study was noted. We recognise that people in psychiatric hospital have already experienced a considerable degree of prior testing compared with those in community settings. Also, for similar reasons, people referred to a specialist centre treating only those with schizophrenia may well be different to those in general care.'
  required: true
- id: intervention_or_topic
  question: 'Cochrane review: "First rank symptoms for schizophrenia". Does this record evaluate the review''s eligible intervention / exposure / index test / topic? Review criterion: Schneider First Rank Symptoms (Table 1). The presence of any one of these symptoms, or multiple symptoms, would be indicative of a diagnosis of schizophrenia. We consider this an acceptable variation in threshold as Kurt Schneider proposed that presence of any one of these symptoms was diagnostic of schizophrenia as long as the person was free of other organic causes such as substance misuse, epilepsy or tumours (Schneider 1959). The different value of one symptom over another is not the focus of this review.'
