# Auto-derived from CSMeD-FT train metadata for CD012004 (Cochrane eligibility sections).
criteria:
- id: study_design
  question: 'Cochrane review: "Motor control exercise for chronic non‐specific low‐back pain". Does this record meet the review''s eligible study design? Review criterion: We only included randomised controlled trials. We did not consider trials with quasi‐random allocation procedures for this review.'
  required: true
- id: population
  question: 'Cochrane review: "Motor control exercise for chronic non‐specific low‐back pain". Does this record study the review''s eligible participants/population? Review criterion: We included studies if they explicitly reported that a criterion for entry was chronic (> 12 weeks) non‐specific LBP (with or without leg pain) or recurrent LBP. We excluded studies that included individuals with specific conditions such as disc herniation, spinal stenosis, cancer etc. We included studies evaluating adults of either gender. We planned a secondary analysis of patients with chronic and recurrent LBP if we were able to retrieve information on whether patients had chronic LBP (first time onset) versus recurrent LBP (defined as pain lasting at least 24 hours, following a 30‐day pain‐free period following a previous episode). We included trials with a mixed population in relation to type and duration of back pain only if separate data for each group were provided or if the majority of patients had chronic LBP (> 75%). In cases where articles did not include enough information to classify patients as having non‐specific LBP or the duration of the pain, we contacted the authors to clarify. If no response was received within one month, with bi‐weekly emails, we excluded and adequately referenced the study.'
  required: true
- id: intervention_or_topic
  question: 'Cochrane review: "Motor control exercise for chronic non‐specific low‐back pain". Does this record evaluate the review''s eligible intervention / exposure / index test / topic? Review criterion: We included trials comparing MCE with placebo, no treatment, another active treatment, or when MCE was added as a supplement to other interventions. When MCE was used in addition to other treatments, it had to represent at least 50% of the total treatment programme to be included. We considered trials to have evaluated MCE if the exercise treatment was described as motor control or specific stabilisation exercise, and/or the trial described exercise aiming to activate, train or restore the function of specific muscles of the spine, such as multifidus and transversus abdominis. We considered specific stabilisation exercises and exercises aiming to activate, train, or restore the stabilisation or co‐ordination of specific deep muscles because these principles integrate the MCE intervention. As reports of trials do not always take into consideration the principles of motor learning, the intervention is often described as specific stabilisation exercises, instead of MCE. Articles were not included if generalised (whole body) stability exercises without consideration of specific muscle activity were performed. A Cochrane review of Pilates was recently published (Yamato 2015), therefore we excluded trials evaluating Pilates from this review although principles of Pilates may overlap with the principles of a motor control intervention.'
  required: true
