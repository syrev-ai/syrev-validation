# Auto-derived from Selection criteria of 10.1002/14651858.cd010558.pub2 (2018) via Europe PMC.
criteria:
- id: study_design
  question: 'Cochrane review: "Psychological therapies for treatment‐resistant depression in adults". Selection criteria: We included randomised controlled trials (RCTs) with participants aged 18 to 74 years diagnosed with unipolar depression that had not responded to minimum four weeks of antidepressant treatment at a recommended dose. We excluded studies of drug intolerance. Acceptable diagnoses of unipolar depression were based onthe Diagnostic and Statistical Manual of Mental Disorders (DSM-IV-TR) or earlier versions, International Classification of Diseases (ICD)-10, Feighner criteria, or Research Diagnostic Criteria. We included the following comparisons.1. Any psychological therapy versus antidepressant treatment alone, or another psychological therapy.2. Any psychological therapy given in addition to antidepressant medication versus antidepressant treatment alone, or a psychological therapy alone.Primary outcomes required were change in depressive symptoms and number of dropouts from study or treatment (as a measure of acceptability). Question: does this record meet the review''s eligible study design?'
  required: true
