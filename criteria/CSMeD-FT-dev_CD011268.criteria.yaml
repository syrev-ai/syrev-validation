  question: 'Cochrane review: "Second‐generation antidepressants for preventing seasonal affective disorder in adults". Does this record study the review''s eligible participants/population? Review criterion: Male and female adults (≥ 18 years of age) of all races, ethnicities and cultural groups with a history of SAD who do not fulfil the criteria for a current major depressive episode. We defined SAD according to the Diagnostic and Statistical Manual of Mental Disorders (DSM‐5; APA 2013), as a seasonal pattern of recurrent major depressive episodes. However, we restricted our focus to winter‐type SAD (i.e. major depression in autumn/winter with full remission in spring/summer), and we did not include people with bipolar disorder with a seasonal pattern. We included studies that used definitions from prior versions of the DSM (APA 1980; APA 1987; APA 2000). We excluded studies that enrolled participants with depressive disorder due to another medical condition. We planned to include populations at risk of SAD with common comorbidities (e.g. diabetes, cardiovascular disease) that are not the cause of the depressive episode. We included studies conducted in all settings. We intended to include studies that provided data on subsets of participants of interest, as long as the subsets met our eligibility criteria. We did not include studies with ''mixed'' populations if investigators did not adequately stratify data with respect to our populations of interest.'
