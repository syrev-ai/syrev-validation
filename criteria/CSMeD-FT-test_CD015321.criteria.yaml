  question: 'Cochrane review: "Non‐pharmacological interventions for prophylaxis of vestibular migraine". Does this record meet the review''s eligible study design? Review criterion: We included randomised controlled trials (RCTs) and quasi‐randomised trials (where trials were designed as RCTs, but the sequence generation for allocation of treatment used methods such as alternate allocation, birth dates etc). The number of episodes of vestibular migraine may vary with time ‐ patients sometimes have periods of more active disease, followed by a period of fewer attacks. Therefore cross‐over trials are not an appropriate study design when assessing prophylaxis for this condition. Cross‐over RCTs would only have been included if data could be extracted for the first phase of the study. If cluster‐RCTs were identified then they would have been eligible for inclusion, providing we could appropriately account for the clustering in the data analysis (according to methods described in the Cochrane Handbook for Systematic Reviews of Interventions) (Handbook 2021). However, we did not identify any cross‐over or cluster‐randomised trials for this review.'
