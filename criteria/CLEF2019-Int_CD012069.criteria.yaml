# Auto-derived from Selection criteria of 10.1002/14651858.cd012069.pub2 (2018) via Europe PMC.
criteria:
- id: study_design
  question: 'Cochrane review: "Methylphenidate for attention deficit hyperactivity disorder (ADHD) in children and adolescents – assessment of adverse events in non‐randomised studies". Selection criteria: We included non-randomised study designs. These comprised comparative and non-comparative cohort studies, patient-control studies, patient reports/series and cross-sectional studies of methylphenidate administered at any dosage or formulation. We also included methylphenidate groups from RCTs assessing methylphenidate versus other interventions for ADHD as well as data from follow-up periods in RCTs. Participants had to have an ADHD diagnosis (from the 3rd to the 5th edition of the Diagnostic and Statistical Manual of Mental Disorders or the 9th or 10th edition of theInternational Classification of Diseases, with or without comorbid diagnoses. We required that at least 75% of participants had a normal intellectual capacity (intelligence quotient of more than 70 points) and were aged below 20 years. We excluded studies that used another ADHD drug as a co-intervention. Question: does this record meet the review''s eligible study design?'
  required: true
