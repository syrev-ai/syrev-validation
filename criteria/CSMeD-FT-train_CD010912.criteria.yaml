  question: 'Cochrane review: "Workplace interventions for reducing sitting at work". Does this record meet the review''s eligible study design? Review criterion: We included randomised controlled trials (RCTs), cross‐over RCTs, cluster‐RCTs, and quasi‐RCTs. Quasi‐RCTs are trials that allocate participants to the intervention or control group using a method of randomisation that is not actually random. At workplaces, interventions operate at group level and may therefore be difficult to deliver to individuals (Ijaz 2014). Since it is more difficult to randomise units when the intervention is implemented at a higher aggregate level, we also included controlled before‐and‐after studies (CBAs) that used a concurrent control group for the interventions that aimed to change workplace arrangements.'
  required: true
- id: population
  question: 'Cochrane review: "Workplace interventions for reducing sitting at work". Does this record study the review''s eligible participants/population? Review criterion: We included all studies conducted with participants aged 18 years or more, whose occupations involved spending the majority of their working time sitting at a desk, such as administrative workers, customer service operators, help‐desk professionals, call‐centre representatives, and receptionists. We excluded studies that addressed transportation work. People working in the transportation industry (such as taxi drivers, truck drivers, bus drivers, and airline pilots) and who operate heavy equipment (such as crane operators and bulldozer operators) are also exposed to prolonged sitting, but current technology provides very limited options for implementing interventions to decrease sitting in such occupations. Reducing sitting in people who work in the transportation industry and operate heavy machinery would require specific interventions that could be the scope of another review.'
