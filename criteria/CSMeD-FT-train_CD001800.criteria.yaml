criteria:
- id: study_design
  question: 'Cochrane review: "Exercise‐based cardiac rehabilitation for coronary heart disease". Does this record meet the review''s eligible study design? Review criterion: We included RCTs (with individual participant or cluster allocation, or cross‐over design) and quasi‐RCTs (RCTs in which treatment allocation was obtained by alternation or other predictable methods) of exercise‐based CR versus ''no exercise'' control. In order to present outcome data that are meaningful and relevant for clinical and policy decision‐making, we limited our search to studies with a follow‐up period of at least six months in our 2011 update of this Cochrane Review and subsequent updates. Where a full text was not available, we contacted the study authors and attempted to collect further information. If we received no response, we placed the study into the ''awaiting classification'' category.'
  required: true
- id: population
  question: 'Cochrane review: "Exercise‐based cardiac rehabilitation for coronary heart disease". Does this record study the review''s eligible participants/population? Review criterion: We included adult (≥ 18 years) men and women, in either hospital‐based and community‐based settings, who have had a myocardial infarction (MI), or who have undergone revascularisation (CABG, PCI) or who have angina pectoris or coronary artery disease defined by angiography. We included trials with mixed indication population as long as more than 50% of the trial participants had a CHD diagnosis. Please note that the terms CHD and coronary artery disease (CAD) are (or can be) sometimes used interchangeably and terms are presented as described by trialists in the Characteristics of included studies. We excluded studies which only included participants following heart valve surgery, with heart failure, atrial fibrillation or heart transplants, or implanted with either cardiac‐resynchronisation therapy or implantable cardiovertor defibrillators. These indications are the subject of other Cochrane reviews (Anderson 2017; Nielsen 2019; Risom 2017; Sibilitz 2016; Long 2019). We also excluded studies of participants who had completed a CR programme prior to randomisation.'
  required: true
- id: intervention_or_topic
  question: 'Cochrane review: "Exercise‐based cardiac rehabilitation for coronary heart disease". Does this record evaluate the review''s eligible intervention / exposure / index test / topic? Review criterion: Exercise‐based CR is defined as a supervised or unsupervised inpatient, outpatient, community‐ or home‐based intervention which includes some form of exercise training that is applied to a cardiac patient population. The intervention could be exercise training alone or exercise training in addition to psychosocial or educational interventions, or both (i.e. "comprehensive CR"). All CR interventions were compared to a ''no exercise'' control, and both the intervention and control group received usual medical care. Usual care could include standard medical care, such as drug therapy, but without any form of structured exercise training or advice.'
  required: true
