  question: 'Cochrane review: "Preoperative inspiratory muscle training for postoperative pulmonary complications in adults undergoing cardiac and major abdominal surgery". Does this record meet the review''s eligible study design? Review criterion: We included all randomized controlled trials (RCTs) that compared preoperative IMT and usual preoperative care for adults undergoing cardiac or major abdominal surgery. We excluded quasi‐randomized studies, historically controlled trials, cohort studies, and case series. However, we planned to include cluster‐randomized trials if the intracluster correlation coefficient was reported.'
  required: true
- id: population
  question: 'Cochrane review: "Preoperative inspiratory muscle training for postoperative pulmonary complications in adults undergoing cardiac and major abdominal surgery". Does this record study the review''s eligible participants/population? Review criterion: We included adults (equal to or greater than 18 years of age) awaiting elective cardiac or major abdominal surgery. We defined cardiac surgery as any surgical procedure involving the heart (for example coronary artery bypass graft surgery, valve surgery, and correction of congenital defects). We defined major abdominal surgery as deliberate breach of peritoneum or retroperitoneum, including abdominal aortic surgery, gastrointestinal surgery, and urological surgery. We excluded participants undergoing chest surgery that may involve the lung per se other than cardiac surgery because such procedures are likely to have a deep influence on pulmonary complications. We also excluded participants if they had undergone surgery within two weeks of initial contact. We excluded participants if they were ASA PS 5, or had a suspected or established respiratory infection.'
  required: true
- id: intervention_or_topic
  question: 'Cochrane review: "Preoperative inspiratory muscle training for postoperative pulmonary complications in adults undergoing cardiac and major abdominal surgery". Does this record evaluate the review''s eligible intervention / exposure / index test / topic? Review criterion: The intervention included a tailored training programme (called ''inspiratory muscle training'', or IMT) designed to increase the strength and endurance of the inspiratory muscles. IMT consists of two distinct types of specific respiratory muscle training (that is respiratory muscle strength (resistive/threshold) and endurance (hyperpnoea) training). Training occurred five to seven times a week for at least two weeks before the actual date of surgery. Each session consisted of 15 to 30 minutes of IMT, performed under supervision by either a physiotherapist, physician, or researcher. The participants were trained to use an inspiratory threshold‐loading device with a load of 10% to 60% of maximal inspiratory muscle strength (Pi‐max). The participants in the intervention group also received usual care as defined below. We excluded participants who also received IMT after the surgery. Our comparative intervention was usual care, a non‐exercise intervention, or no intervention. The usual‐care group received care as usual the day before surgery (instruction on deep‐breathing manoeuvres, IS, coughing, and early mobilization may be provided). We included trials that required participants to undergo rehabilitation, as long as both groups (control and intervention) received similar IS, chest physiotherapy, and mobilization after surgery.'
  required: true
