  question: 'Cochrane review: "Interventions for promoting reintegration and reducing harmful behaviour and lifestyles in street‐connected children and young people". Does this record study the review''s eligible participants/population? Review criterion: We included all studies that focused on street‐connected children and young people between birth and 24 years of age (inclusive), consistent with the United Nations (UN) definition of youth as those 15 to 24 years of age, regardless of location, reason for street connectedness or gender. Potential research participants included street‐connected children and young people; their families and carers; professionals working with children, young people and their families; the police; and employers. Street‐connected children and young people and, in cases of family‐focused interventions their families and carers, were the recipients of interventions. We did not include studies unless they reported separate outcomes data on street‐connected children and young people in the context of systemic interventions. Families and carers, the community, employers and professionals can be an important part of the ‘input’ component of the intervention to the extent that they are needed to support the intervention and are part of it. Our definition of professionals and the community included non‐governmental organisations (NGOs), faith‐based organisations, orphanages, social workers and police. For the purposes of this review, we defined street‐connected children as in the Description of the condition section above: children and young people who live and work on the street or in public spaces, work on the street and return to family homes or hostels at night or live both ways at different times. F'
