  question: 'Cochrane review: "Interventions for promoting reintegration and reducing harmful behaviour and lifestyles in street‐connected children and young people". Does this record evaluate the review''s eligible intervention / exposure / index test / topic? Review criterion: The intention was to include any interventions that: involved harm‐reduction, inclusion or reintegration programmes for street‐connected children and young people, were intended to reduce harms associated with risky sexual activity and substance misuse and promoted inclusion and reintegration; increased literacy, numeracy and self esteem; increased participation in education and skills‐based employment; and provided shelter, housing and drop‐in support. involved harm‐reduction, inclusion or reintegration programmes for street‐connected children and young people, were intended to reduce harms associated with risky sexual activity and substance misuse and promoted inclusion and reintegration; increased literacy, numeracy and self esteem; increased participation in education and skills‐based employment; and provided shelter, housing and drop‐in support. We planned to include any type of intervention including behavioural, social, policy, structural or other interventions explicitly aimed at reducing risky sexual activity and substance misuse. Interventions may be delivered to individuals, families, small groups or entire communities. Furthermore, with increased recognition of the complexity of the issues facing many street‐connected young people, researchers have focused on multi‐faceted interventions that incorporate a range of approaches, including housing, education, training and health (Thomas de Benitez 2008).'
