# Auto-derived from Selection criteria of 10.1002/14651858.cd008874.pub2 (2018) via Europe PMC.
criteria:
- id: study_design
  question: 'Cochrane review: "Airway physical examination tests for detection of difficult airway management in apparently normal adult patients". Selection criteria: We considered full-text diagnostic test accuracy studies of any individual index test, or a combination of tests, against a reference standard. Participants were adults without obvious airway abnormalities, who were having laryngoscopy performed with a standard laryngoscope and the trachea intubated with a standard tracheal tube. Index tests included the Mallampati test, modified Mallampati test, Wilson risk score, thyromental distance, sternomental distance, mouth opening test, upper lip bite test, or any combination of these. The target condition was difficult airway, with one of the following reference standards: difficult face mask ventilation, difficult laryngoscopy, difficult tracheal intubation, and failed intubation. Question: does this record meet the review''s eligible study design?'
