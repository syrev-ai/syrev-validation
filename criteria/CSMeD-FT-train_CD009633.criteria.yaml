  question: 'Cochrane review: "Clonidine premedication for postoperative analgesia in children". Does this record evaluate the review''s eligible intervention / exposure / index test / topic? Review criterion: We included any study where clonidine had been given as a premedication for any type of anaesthetic, regardless of the type of surgery and regardless of the stated purpose of giving clonidine as long as pain or one of its surrogates had been reported as an outcome. We therefore included studies where the primary outcome measure was, for instance, anxiolysis but where postoperative pain or analgesic use was measured as a secondary outcome. We included studies regardless of the route of administration of clonidine, as long as it had been used systemically. For example, we did not include studies where clonidine had been added to a regional block unless the study contained arms that had systemic clonidine versus a control as their only difference. We included studies where clonidine was compared to a placebo, those where it was compared to some other drug treatment, for example midazolam or a higher dose of clonidine, and those where it was compared to no intervention at all. We excluded dose‐finding studies except where one arm of the trial equated to a placebo or comparison treatment, for example normal saline or midazolam, and all other aspects of the anaesthetic were the same between arms. We excluded studies where there were significant confounding factors. Specifically, we excluded studies where more than one treatment had been changed, for example clonidine and ketamine versus midazolam alone. We excluded studies where clonidine had been given after induction of anaesthes'
