  question: 'Cochrane review: "Reduction in saturated fat intake for cardiovascular disease". Does this record evaluate the review''s eligible intervention / exposure / index test / topic? Review criterion: We included randomised controlled trials stating an intention to reduce saturated fat (SFA) intake (by suggesting appropriate nutrient‐based or food‐based aims) OR which provided a general dietary aim, such as improving heart health or reducing total fat, that also achieved a statistically significant saturated fat reduction (P < 0.05) during the trial in the intervention arm compared with the control arm. The intervention had to be dietary advice, supplementation of fats, oils or modified or low‐fat foods, or a provided diet, compared to higher saturated fat intake which could be usual diet, higher saturated fat, placebo or a control diet. Intended duration of the dietary intervention was at least two years (24 months or 104 weeks). We excluded multiple risk factor interventions other than diet or supplementation (unless effects of diet or supplementation could be separated, as in a factorial design, so that the additional intervention was consistent or randomised between the intervention or control groups) and studies that aimed for weight loss in one arm but not the other. Atkins‐type diets aiming to increase protein and fat intake were excluded, as were studies where fat was reduced by means of a fat‐substitute (like Olestra). Enteral and parenteral feeds were excluded, as were formula weight reducing diets. Examples: studies that reduced saturated fats and encouraged physical activity in one arm and compared with encouraging physical activity in the control were included'
