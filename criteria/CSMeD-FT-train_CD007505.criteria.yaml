# Auto-derived from CSMeD-FT train metadata for CD007505 (Cochrane eligibility sections).
criteria:
- id: study_design
  question: 'Cochrane review: "Pharmacotherapy for anxiety and comorbid alcohol use disorders". Does this record meet the review''s eligible study design? Review criterion: All RCTs of pharmacotherapy for treating anxiety disorders with comorbid alcohol use disorders. We only included group‐based treatments if they employed a cluster randomization design. We excluded trials in which the allocation sequence was generated via a quasi‐random procedure (such as determining group allocation by day of the week or alternation). We applied no language restrictions. We included both trials targeting relapse prevention as well as the treatment of ongoing alcohol dependence or abuse in the review. Alcohol withdrawal may result in a short‐term increase in anxiety symptoms, with evidence that these symptoms stabilize within four to eight weeks of the onset of abstinence (Schuckit 1988; Driessen 2001). Therefore, we did not included relapse prevention studies that diagnosed anxiety disorders with a symptom profile similar to that observed during withdrawal (i.e. GAD, PD) within four weeks after the discontinuation of alcohol consumption in the review.'
  required: true
- id: population
  question: 'Cochrane review: "Pharmacotherapy for anxiety and comorbid alcohol use disorders". Does this record study the review''s eligible participants/population? Review criterion: We imposed no age restrictions. We included people diagnosed with alcohol dependence or abuse and an anxiety disorder according to DSM‐III (APA 1980), DSM‐IV (APA 1994), or DSM‐IV‐TR (APA 2000) criteria. We used the diagnosis of additional comorbid psychiatric diagnoses (excluding other secondary anxiety disorders) as an exclusion criteria. We revised the original protocol to include participants with major depressive disorder (MDD), given the frequent co‐occurrence of MDD in this comorbid population (see Differences between protocol and review). The presence of physical disabilities did not qualify as an exclusion criteria, with the exception of traumatic brain injury in RCTs of PTSD (due to difficulties in distinguishing between the symptoms of PTSD and traumatic brain injury). We applied no restrictions with regards to country in which the trial took place, the number of centres involved or whether trials were conducted in outpatient or inpatient settings.'
  required: true
- id: intervention_or_topic
  question: 'Cochrane review: "Pharmacotherapy for anxiety and comorbid alcohol use disorders". Does this record evaluate the review''s eligible intervention / exposure / index test / topic? Review criterion: All medication interventions in which the drug was administered to treat anxiety disorders were eligible for inclusion in this review. However, we did not include trials in which people were receiving concurrent psychotropic medications or that were limited to the comparison of drugs administered with the purpose of affecting drinking behaviour, such as naltrexone, disulfiram and acamprosate. As we anticipated that most treatment studies targeting anxiety disorders in people with comorbid alcohol use disorders would employ concurrent behavioural modification programmes to treat alcohol dependence/abuse, the presence of such strategies did not serve as an exclusion criteria. Control interventions included placebo, standard treatment and other medications.'
  required: true
