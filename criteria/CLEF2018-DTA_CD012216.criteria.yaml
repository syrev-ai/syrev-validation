  question: 'Cochrane review: "18F PET with florbetapir for the early diagnosis of Alzheimer’s disease dementia and other dementias in people with mild cognitive impairment (MCI)". Selection criteria: We included studies that had prospectively defined cohorts with any accepted definition of MCI at time of performing the test and the use of 18 F-florbetapir scan to evaluate the DTA of the progression from MCI to ADD or other forms of dementia. In addition, we only selected studies that applied a reference standard for Alzheimer''s dementia diagnosis, for example, National Institute of Neurological and Communicative Disorders and Stroke and the Alzheimer''s Disease and Related Disorders Association (NINCDS-ADRDA) or Diagnostic and Statistical Manual of Mental Disorders-IV (DSM-IV) criteria. Question: does this record meet the review''s eligible study design?'
