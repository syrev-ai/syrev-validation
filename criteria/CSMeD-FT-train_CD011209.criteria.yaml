- id: study_design
  question: 'Cochrane review: "Nortriptyline for neuropathic pain in adults". Does this record meet the review''s eligible study design? Review criterion: We included studies if they were randomised controlled trials (RCTs) with double‐blind assessment of participant outcomes following two weeks or more of treatment, although the emphasis of the review was on studies with a duration of eight weeks or longer. We required full journal publication, with the exception of online clinical trial results summaries of otherwise unpublished clinical trials and abstracts with sufficient data for analysis. We did not include short abstracts (usually meeting reports). We excluded studies that were non‐randomised, studies of experimental pain, case reports, and clinical observations. Our experience from previous reviews was that most studies would be older, small, and have methodological deficiencies according to present standards of evidence, and therefore we felt it appropriate to consider lower standards of evidence than those currently demanded for part of our analyses. This included reviewing data from studies of shorter duration, and studies where the outcome definition was poorly defined; all studies had to be both randomised and double‐blind as a minimum. We have reported the evidence available according to the current standards, and lower levels of evidence. It is important to recognise that the lower level evidence is likely to be subject to various positive biases, and that these lower levels of evidence cannot be used to make cross‐drug comparisons of efficacy with other drugs.'
  required: true
- id: population
  question: 'Cochrane review: "Nortriptyline for neuropathic pain in adults". Does this record study the review''s eligible participants/population? Review criterion: Studies enrolled adults aged 18 years and above with one or more of a wide range of chronic neuropathic pain conditions including (but not limited to): cancer‐related neuropathy; central neuropathic pain; complex regional pain syndrome (CRPS) Type II; human immunodeficiency virus (HIV) neuropathy; painful diabetic neuropathy (PDN); phantom limb pain; postherpetic neuralgia (PHN); postoperative or traumatic neuropathic pain; spinal cord injury; trigeminal neuralgia; cancer‐related neuropathy; central neuropathic pain; complex regional pain syndrome (CRPS) Type II; human immunodeficiency virus (HIV) neuropathy; painful diabetic neuropathy (PDN); phantom limb pain; postherpetic neuralgia (PHN); postoperative or traumatic neuropathic pain; spinal cord injury; trigeminal neuralgia; and CRPS Type 1. We included studies of participants with more than one type of neuropathic pain; in such cases, we analysed results according to the primary condition. We excluded studies using nortriptyline for prevention of migraine and headache as they are the subject of another Cochrane review (Chronicle 2004).'
  required: true
