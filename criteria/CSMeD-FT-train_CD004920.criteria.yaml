  question: 'Cochrane review: "Antifungal agents for preventing fungal infections in non‐neutropenic critically ill patients". Does this record meet the review''s eligible study design? Review criterion: We considered all randomized controlled trials (RCTs) that evaluated the effect of any antifungal agent given as untargeted treatment in non‐neutropenic critically ill adults and children.'
  required: true
- id: population
  question: 'Cochrane review: "Antifungal agents for preventing fungal infections in non‐neutropenic critically ill patients". Does this record study the review''s eligible participants/population? Review criterion: We considered trials involving adult participants (aged 18 years or over) and children (aged less than 18 years), classified as critically ill (such as those admitted to an ICU or having recently undergone an abdominal or other major surgical procedure). We excluded trials involving neutropenic, neonatal or HIV‐infected participants, participants predominantly with malignancies or solid organ transplant recipients, as systematic reviews have been published for these patient groups (Austin 2013a; Austin 2013b; Gøtzsche 2014). We included trials including non‐neutropenic critically ill participants along with other groups if the proportion of these was less than 25% or if data on non‐neutropenic patients were separately provided.'
  required: true
- id: intervention_or_topic
  question: 'Cochrane review: "Antifungal agents for preventing fungal infections in non‐neutropenic critically ill patients". Does this record evaluate the review''s eligible intervention / exposure / index test / topic? Review criterion: We considered trials if they involved the randomized comparison of any antifungal drug (either systemic or nonabsorbable) with placebo, no antifungal or any other antifungal drug (either systemic or nonabsorbable). We included studies in which antifungal drugs were initiated before microbiological definitive evidence of infection (untargeted approach, encompassing the prophylactic, pre‐emptive and empiric treatment). We decided to consider an eligible intervention the administration of untargeted treatment with nonabsorbable antifungals since colonization has been described as a risk factor for subsequent development of IFIs (Lau 2015; Pittet 1994; Vardakas 2009) and the use of nonabsorbable antifungal has been recently studied as a measure for risk reduction (Giglio 2012). We defined nonabsorbable antifungal as a drug administered enterally (e.g. orally or through a nasogastric tube) with a topical antifungal effect and no systemic absorption. The study groups were required to differ only for the antifungal regimen under investigation; other co‐interventions and aspects of care, including the routine use of other antimicrobial agents, were required to be the same to avoid potentially confounded comparisons. We excluded studies not reporting the molecule of the antifungal drug used and if this information was not obtained after contacting the authors of the studies.'
  required: true
