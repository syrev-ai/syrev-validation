# Auto-derived from CSMeD-FT train metadata for CD010226 (Cochrane eligibility sections).
criteria:
- id: study_design
  question: 'Cochrane review: "Trifluoperazine versus placebo for schizophrenia". Does this record meet the review''s eligible study design? Review criterion: All relevant randomised controlled trials. If a trial was described as ''double blind'' but implied randomisation, we included such trials in a sensitivity analysis (see Sensitivity analysis). If their inclusion did not result in a substantive difference, they remained in the analyses. If their inclusion did result in important clinically significant, but not necessarily statistically significant differences, we did not add the data from these lower quality studies to the results of the better trials, but presented such data within a subcategory. We excluded quasi‐randomised studies, such as those allocating by alternate days of the week. Where people were given additional treatments within trifluoperazine, we only included data if the adjunct treatment was evenly distributed between groups and it was only the trifluoperazine that was randomised. With regards to selecting studies for economic evaluations, review authors (SS and VF) categorised studies as per the following: Type A ‐ Full economic evaluation (within the framework of RCT): studies that focus on cost‐effectiveness analysis, cost‐utility analysis and cost‐benefit analysis. Type B ‐ Partial economic evaluation (within the framework of RCT): studies that focus on cost‐analysis and cost‐minimisation studies of trifluoperazine. Type C ‐ Randomised trials that reported limited information, such as estimates of resources use or costs associated with trifluoperazine.'
  required: true
- id: population
  question: 'Cochrane review: "Trifluoperazine versus placebo for schizophrenia". Does this record study the review''s eligible participants/population? Review criterion: Participants with schizophrenia or related disorders, including schizophreniform disorder, schizoaffective disorder and delusional disorder, again, by any means of diagnosis. We were interested in making sure that information was as relevant to the current care of people with schizophrenia as possible. We therefore sought to clearly highlight the current clinical state (acute, early post‐acute, partial remission, remission) as well as the stage (prodromal, first episode, early illness, persistent) and whether the studies primarily focused on people with particular problems (for example, negative symptoms, treatment‐resistant illnesses).'
  required: true
- id: intervention_or_topic
  question: 'Cochrane review: "Trifluoperazine versus placebo for schizophrenia". Does this record evaluate the review''s eligible intervention / exposure / index test / topic? Review criterion: Any dose administered by any means. We sought to keep to BNF 2012 doses ‐ "initially 5 mg twice daily, increased by 5 mg daily after 1 week, then at intervals of 3 days, according to the response; elderly reduce initial dose by at least half" ‐ and to consider any dose over 30 mg as very high. Doses outside this range were further investigated using sensitivity analysis. Any form of placebo or no treatment alternative.'
  required: true
