- id: study_design
  question: 'Cochrane review: "Pharmacological interventions for the prevention of bleeding in people undergoing elective hip or knee surgery: a systematic review and network meta‐analysis". Selection criteria: We included RCTs of people undergoing elective hip or knee surgery only. We excluded non‐elective or emergency procedures, and studies published since 2010 that had not been prospectively registered (Cochrane Injuries policy). There were no restrictions on gender, ethnicity or age (adults only). We excluded studies that used standard of care as the comparator. Eligible interventions included: antifibrinolytics (tranexamic acid (TXA), aprotinin, epsilon‐aminocaproic acid (EACA)), desmopressin, factor VIIa and XIII, fibrinogen, fibrin sealants and non‐fibrin sealants. Question: does this record meet the review''s eligible study design?'
  required: true
