  question: 'Cochrane review: "Case management approaches to home support for people with dementia". Does this record evaluate the review''s eligible intervention / exposure / index test / topic? Review criterion: Any case management intervention delivered in the community (not in hospital or in residential care settings) that predominantly focused on the planning and co‐ordination of care required to meet the identified needs of the person with dementia. This may or may not have been part of multi‐component interventions. ''Treatment as usual'', standard community treatment, other non‐case management or waiting‐list controls. This may include any method of care such as primary health care (services that are offered in the community, e.g. general practitioners, and not in hospitals or specialist centres, and are usually the first point of contact for a patient). This may occur in isolation or along with referrals and management by mental health professionals, who may or may not be part of a community mental health team for elderly people.'
