# Auto-derived from the [SEL] selection criteria shipped with Chan 2025 manual-search data for CD013880.
criteria:
- id: study_design
  question: 'Cochrane review: "Models for delivery and co‐ordination of primary or secondary health care (or both) to older adults living in aged care facilities". Selection criteria: We included individual and cluster‐randomised trials, and cost/cost‐effectiveness data collected alongside eligible effectiveness studies. Eligible study participants included older people who reside in an ACF as their place of permanent abode and healthcare professionals delivering or co‐ordinating the delivery of healthcare at ACFs. Eligible interventions focused on either ways of delivering primary or secondary health care (or both) or ways of co‐ordinating the delivery of this care. Eligible comparators included usual care or another model of care. Primary outcomes were emergency department visits, unplanned hospital admissions and adverse effects (defined as infections, falls and pressure ulcers). Secondary outcomes included adherence to clinical guideline‐recommended care, health‐related quality of life of residents, mortality, resource use, access to primary or specialist healthcare services, any hospital admissions, length of hospital stay, satisfaction with the health care by residents and their families, work‐related satisfaction and work‐related stress of ACF staff. Question: does this record meet the review''s eligible study design?'
  required: true
