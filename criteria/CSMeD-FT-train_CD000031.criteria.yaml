- id: intervention_or_topic
  question: 'Cochrane review: "Antidepressants for smoking cessation". Does this record evaluate the review''s eligible intervention / exposure / index test / topic? Review criterion: We included trials studying pharmacotherapies with antidepressant properties for smoking cessation. We included trials assessing different doses, durations, and schedules of antidepressants. We excluded trials where an additional, uncontrolled, non‐antidepressant intervention component was used in only one of the trial arms. This is because the confounding effects of this intervention would have made it difficult to determine whether any change in outcome was related to the antidepressant or the confounding intervention component. Additionally, we excluded trials investigating antidepressant use for smoking harm reduction or relapse prevention, as they are covered elsewhere (Lindson‐Hawley 2016 and Livingstone‐Banks 2019, respectively). The following comparators were eligible for assessing harms, efficacy, and tolerability: placebo, no pharmacological treatment, alternative therapeutic control, or different dosages/treatment regimes of the same antidepressant.'
