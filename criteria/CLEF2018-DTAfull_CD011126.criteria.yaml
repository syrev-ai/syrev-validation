  question: 'Cochrane review: "Three-dimensional saline infusion sonography compared to two-dimensional saline infusion sonography for the diagnosis of focal intracavitary lesions". Selection criteria: The population of interest consisted of premenopausal women with AUB or subfertility and postmenopausal women with AUB. Diagnostic test accuracy studies, randomised controlled trials (RCTs) and prospective cohort studies were eligible for inclusion if they evaluated the accuracy of both 2D SIS and 3D SIS for the diagnosis of acquired intracavitary abnormalities with hysteroscopy used as the reference standard. In light of the lack of data for 3D SIS, we also included studies that evaluated the accuracy of 3D SIS alone. Question: does this record meet the review''s eligible study design?'
