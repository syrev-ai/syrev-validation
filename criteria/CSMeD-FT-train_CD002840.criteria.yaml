  question: 'Cochrane review: "Treadmill training and body weight support for walking after stroke". Does this record study the review''s eligible participants/population? Review criterion: We included trials of adults who had suffered a stroke and exhibited an abnormal gait pattern. We used the World Health Organization''s (WHO) definition of stroke: "rapidly developing clinical signs of focal (at times global) disturbance of cerebral function, lasting more than 24 hours or leading to death, with no apparent cause other than that of vascular origin." (Hatano 1976). We defined an abnormal gait pattern as walking with a slow speed, exhibiting kinematic deviations during gait (Moore 1993; Moseley 1993), or an inability to walk. We envisaged that some trials may have included participants with other types of upper motor neurone lesions (e.g. traumatic brain injury, multiple sclerosis). However, we did not identify any mixed trials. If we identify trials using mixed types of participants in future updates of this review, we will attempt to obtain data for the stroke subgroup only via correspondence with the trialists.'
