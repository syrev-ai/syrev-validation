  question: 'Cochrane review: "Optical coherence tomography (OCT) for detection of macular oedema in patients with diabetic retinopathy". Does this record study the review''s eligible participants/population? Review criterion: Included participants were people referred to ophthalmologists because they had been found to have some level of DR, expectedly by primary care professionals, such as optometrists, diabetologists and general practitioners, or by other ophthalmologists. Prevalence is often an indicator of severity of disease spectrum in a study. If patients with any level of DR were examined, the prevalence of DMO would be expected to be lower than 10% (Williams 2004; Yau 2012). However, a relatively high prevalence of DMO was expected, as found in studies included in a previous systematic review (Virgili 2007) and conducted in retina practices, suggesting that a diagnosis of more severe DR, or even any DMO, had already been carried out in the study population.'
