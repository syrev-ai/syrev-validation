  question: 'Cochrane review: "Optical coherence tomography (OCT) for detection of macular oedema in patients with diabetic retinopathy". Does this record meet the review''s eligible study design? Review criterion: We planned to include all prospective and retrospective consecutive series of patients and case‐control studies that evaluated the accuracy of OCT for diagnosing DMO. As discussed above, we acknowledge that the clinical pathway is unclear and may vary across settings and countries. Therefore, we accepted studies in which a two‐by‐two table was presented which crossed the results of OCT retinal thickness, dichotomised at the approximate thresholds of interest, with ophthalmologists'' detection of DMO or CSMO by means of fundus biomicroscopy or photography as defined later. We recorded the settings in which patients were recruited and examined in each study.'
