# Auto-derived from CSMeD-FT train metadata for CD003557 (Cochrane eligibility sections).
criteria:
- id: study_design
  question: 'Cochrane review: "Antibiotics and antiseptics for venous leg ulcers". Does this record meet the review''s eligible study design? Review criterion: We included prospective randomised controlled trials (RCTs), published or unpublished, evaluating systemic or topical antibiotics or topical antiseptics in the treatment of venous ulcers, irrespective of the language of the report. RCTs reported in abstract form only were eligible for inclusion, provided adequate information was presented in the abstract or was available from the trial authors. Studies using quasi‐randomisation were excluded.'
  required: true
- id: population
  question: 'Cochrane review: "Antibiotics and antiseptics for venous leg ulcers". Does this record study the review''s eligible participants/population? Review criterion: RCTs recruiting people described in the primary report as having venous leg ulcers, managed in any care setting, were eligible for inclusion. As the method of diagnosis of venous ulceration may vary, we accepted definitions as used in the RCTs. We included RCTs that recruited people with various types of wounds (e.g. arterial ulcers, diabetic foot ulcers) if the results for participants with venous ulcers were presented separately, or if most participants (at least 75%) had leg ulcers of venous aetiology (origin). Selection of trials was not restricted to those with a certain wound status at baseline (i.e. those with colonised or infected wounds); when information about these variables was given, it was recorded (see Data extraction and management).'
  required: true
- id: intervention_or_topic
  question: 'Cochrane review: "Antibiotics and antiseptics for venous leg ulcers". Does this record evaluate the review''s eligible intervention / exposure / index test / topic? Review criterion: Interventions of interest included antibiotics (topical or systemic) and antiseptics (topical) as prescribed for venous leg ulceration. Systemic antibiotics could be given orally or by other routes (e.g. intravenously). Control regimens could include placebo, an alternative antibiotic or antiseptic, any other therapy, standard care or no treatment. Both intervention and control regimens could consist of antibiotics and antiseptics administered singly or in combination. Intervention schedules that included concurrent therapies (e.g. compression) were included provided that such treatment was delivered in a standardised way across study arms. Interventions could be delivered in any setting (inpatient, outpatient, nursing home plus any others). The following were excluded: RCTs in which the presence or absence of a specific antibiotic or antiseptic intervention was not the only systematic difference between treatment groups; evaluations of antibiotics or antiseptics used as preparations for skin grafting to treat leg ulceration; and evaluations of physical therapies with purported antimicrobial effects.'
  required: true
