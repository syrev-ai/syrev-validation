  question: 'Cochrane review: "Intratympanic gentamicin for Ménière’s disease". Does this record evaluate the review''s eligible intervention / exposure / index test / topic? Review criterion: We included the following interventions: gentamicin. gentamicin. If we had identified other intratympanic aminoglycosides (for example, streptomycin) then these would also have been included in the review, but we did not find any relevant studies that considered other aminoglycosides. The main comparison is: gentamicin versus placebo/no treatment. gentamicin versus placebo/no treatment. There were no limits on the type of concurrent treatments used, providing these were used equally in each arm of the study. We pooled studies that included concurrent treatments with those where participants did not receive concurrent treatment. We planned to conduct subgroup analysis to determine whether the effect estimates may be different in those receiving additional treatment. However, due to the small number of studies included in the review this was not possible (see Subgroup analysis and investigation of heterogeneity).'
