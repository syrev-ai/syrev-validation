# Auto-derived from Selection criteria of 10.1002/14651858.cd012768.pub2 (2018) via Europe PMC.
criteria:
- id: study_design
  question: 'Cochrane review: "Xpert® MTB/RIF assay for extrapulmonary tuberculosis and rifampicin resistance". Selection criteria: We included diagnostic accuracy studies of Xpert in people presumed to have extrapulmonary TB. We included TB meningitis and pleural, lymph node, bone or joint, genitourinary, peritoneal, pericardial, and disseminated TB. We used culture as the reference standard. For pleural TB, we also included a composite reference standard, which defined a positive result as the presence of granulomatous inflammation or a positive culture result. For rifampicin resistance, we used culture-based drug susceptibility testing or MTBDRplus as the reference standard. Question: does this record meet the review''s eligible study design?'
