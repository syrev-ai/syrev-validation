  question: 'Cochrane review: "Mini‐Mental State Examination (MMSE) for the detection of dementia in clinically unevaluated people aged 65 and over in community and primary care populations". Does this record evaluate the review''s eligible intervention / exposure / index test / topic? Review criterion: The index test is the 11‐item (maximum score 30) MMSE test (Folstein 1975). We recognised that other versions of the test exist (Grace 1995; Harrell 2000; Haubois 2012; Kabir 2000; Molloy 1991; Tschanz 2002), but we considered that these were best investigated in separate studies because of the substantial heterogeneity in the diagnostic test performance of these instruments. We also judged that including these index test variants would create an unfeasible workload for this review. However, we did not exclude studies on the basis of language, and we included studies that reported, for example, the diagnostic test accuracy of the Korean version of the 11‐item MMSE. Because education is associated with dementia (Fratiglioni 1991), some studies adjust the MMSE score for educational attainment (e.g. Liu 1996a).'
