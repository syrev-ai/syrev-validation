criteria:
- id: study_design
  question: 'Cochrane review: "Remote care through telehealth for people with inflammatory bowel disease". Does this record meet the review''s eligible study design? Review criterion: All published, unpublished, and ongoing randomised controlled trials (RCTs) that evaluated telecommunication technologies for the management of IBD versus face‐to‐face interventions or no intervention. Cross‐over studies and cluster‐RCTs were eligible for inclusion, but quasi‐randomised trials (using inappropriate randomisation) were ineligible. We did not include studies on digital patient information resources (e.g. information on IBD organisation websites, such as Crohn''s and Colitis UK), or education resources alone, unless they formed part of a wider package that included an element of telehealth as defined in this review. A separate Cochrane Review is focussing on education resources for people with IBD (Gordon 2021a). We excluded studies where remote monitoring of blood or faecal tests was the only form of monitoring.'
