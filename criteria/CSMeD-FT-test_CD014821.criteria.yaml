  question: 'Cochrane review: "Remote care through telehealth for people with inflammatory bowel disease". Does this record study the review''s eligible participants/population? Review criterion: People of all ages with a confirmed IBD diagnosis. Subsets such as CD, UC, or intermediate colitis were eligible.'
  required: true
- id: intervention_or_topic
  question: 'Cochrane review: "Remote care through telehealth for people with inflammatory bowel disease". Does this record evaluate the review''s eligible intervention / exposure / index test / topic? Review criterion: We included studies on IBD management interventions that took place via phone, instant messaging, video, text message, or web‐based services, or any other means of remote communication, whether live (e.g. telephone conversations) or delayed (e.g. email). We considered any control intervention, such as face‐to‐face interventions, no intervention. Studies that compared different telehealth interventions to each other were also eligible. We aimed to perform separate analyses for trials that evaluated telehealth plus traditional consultations versus traditional consultations alone and trials that evaluated telehealth versus traditional consultations.'
