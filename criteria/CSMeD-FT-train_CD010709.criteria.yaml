# Auto-derived from CSMeD-FT train metadata for CD010709 (Cochrane eligibility sections).
criteria:
- id: study_design
  question: 'Cochrane review: "Pre‐emptive correction for haemodialysis arteriovenous access stenosis". Does this record meet the review''s eligible study design? Review criterion: We included RCTs and quasi‐RCTs (RCTs in which allocation to treatment was obtained by predictable methods such as alternation, use of alternate medical records, or date of birth) evaluating the benefits and harms of a pre‐emptive strategy to correct AV access stenosis in adults treated with haemodialysis or planned to start haemodialysis for end‐stage kidney disease. We included studies of any follow‐up duration without language restriction.'
  required: true
- id: population
  question: 'Cochrane review: "Pre‐emptive correction for haemodialysis arteriovenous access stenosis". Does this record study the review''s eligible participants/population? Review criterion: We included RCTs that enrolled people who had an AV access (either a fistula or a graft) that was suitable for haemodialysis (or other extra‐corporeal dialysis methods including haemofiltration and haemodiafiltration) regardless of the duration of their dialysis treatment. We included RCTs of pre‐emptive stenosis correction in a mature AV access. These studies evaluated the effects of strategies planned to identify (through regular access surveillance) and correct pre‐emptively a previously unknown/unidentified access stenosis (primary prophylaxis) or the effects of pre‐emptive correction of a known stenosis in a non‐dysfunctional access (secondary prophylaxis). We excluded studies in which participants received haemodialysis to treat acute kidney injury or used a central venous catheter for haemodialysis instead of an AV access. We also excluded studies comparing different approaches to salvage a dysfunctional, failing or clotted access (an access that was not suitable for haemodialysis).'
  required: true
- id: intervention_or_topic
  question: 'Cochrane review: "Pre‐emptive correction for haemodialysis arteriovenous access stenosis". Does this record evaluate the review''s eligible intervention / exposure / index test / topic? Review criterion: Interventions could be based on a surveillance method (alone or in addition to standard clinical monitoring) designed to identify early stenotic lesions in a functioning AV access that could be corrected pre‐emptively, i.e. prior to access dysfunction (primary prophylaxis). Any screening strategy and diagnostic criteria defining the access eligibility for correction were allowed, including surveillance techniques and imaging tests, or a critical value for a documented stenosis or a lesion clinically suspected. Also, any pre‐emptive correction procedure was allowed including surgical interventions (open or endovascular surgery) or imaging‐assisted procedures (angioplasty), with or without stenting. In studies enrolling people with a documented stenotic lesion in an otherwise functioning AV fistula or graft the active intervention was any of these pre‐emptive correction procedures (secondary prophylaxis). The comparator was either another surveillance method for pre‐emptive correction of an access stenosis (active comparator) or a strategy based on deferred correction of a stenosis, i.e. a correction postponed to when the access became dysfunctional (inactive comparator). As for the intervention, for the comparator we considered any diagnostic criteria for eligibility for correction, including monitoring methods, surveillance techniques and imaging tests, or a critical value for a documented stenosis or a lesion clinically suspected.'
  required: true
