  question: 'Cochrane review: "Haloperidol versus first‐generation antipsychotics for the treatment of schizophrenia and other psychotic disorders". Does this record evaluate the review''s eligible intervention / exposure / index test / topic? Review criterion: Any oral form (oral tablets, oral liquids) at any dose. We excluded depot formulations. Injections (i.m. ‐ intramuscular, or i.v. ‐ intravenous) were allowed for initial treatment, but we included data only if people were transferred to oral medication within the first week. Any other first‐generation antipsychotic agent that is currently available in at least one country worldwide with the exception of the low‐potency antipsychotics chlorpromazine, chlorprothixene, levopromazine, mesoridazine, perazine, prochlorpromazine, and thioridazine that were already compared with haloperidol in other Cochrane Reviews (Table 1) (Leucht 2008; Tardy 2011a). The medication could be administered in any oral form (oral tablets, oral liquids) at any dose. We excluded depot formulations. Injections (i.m. ‐ intramuscular, or i.v. ‐ intravenous) were allowed for initial treatment, but we included data only if people were transferred to oral medication within the first week.'
