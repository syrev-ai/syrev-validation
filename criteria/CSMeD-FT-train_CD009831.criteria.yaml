  question: 'Cochrane review: "Haloperidol versus first‐generation antipsychotics for the treatment of schizophrenia and other psychotic disorders". Does this record study the review''s eligible participants/population? Review criterion: We included all randomised studies of participants with schizophrenia and other types of schizophrenia‐like psychoses (e.g. schizophreniform, schizoaffective, or delusional disorders), irrespective of the diagnostic system applied. There is no clear evidence that the schizophrenia‐like psychoses are caused by fundamentally different disease processes or require different treatment approaches (Carpenter 1994). In accordance with the general strategy of the Cochrane Schizophrenia Group (see group module), we included studies that had used other diagnostic criteria than those of the International Statistical Classification of Diseases and Related Health Problems (ICD) and the Diagnostic and Statistical Manual of Mental Disorders (DSM). These diagnostic criteria are not meticulously used in clinical routine either, so broader inclusion criteria will enhance applicability of findings. Patients were included without a restriction concerning age, gender and whether they were suffering from other conditions. If a study involved people with other diagnoses, we only included it if at least 75% of participants suffered from a schizophrenic syndrome or, if that was not the case, results regarding people exclusively with schizophrenia were reported. We included studies with participants suffering from first episode schizophrenia as well as multiple episodes. Additionally, we included trials investigating treatment‐resistant participants. We considered these different conditions by applyin'
