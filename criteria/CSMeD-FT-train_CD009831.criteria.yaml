  question: 'Cochrane review: "Haloperidol versus first‐generation antipsychotics for the treatment of schizophrenia and other psychotic disorders". Does this record meet the review''s eligible study design? Review criterion: We included all relevant randomised trials. We excluded quasi‐randomised studies such as those using allocation by day of the week, date of birth, or alternate allocation. This decision was based on the evidence of a strong relationship between allocation concealment and direction of effect (Schulz 1995). Where a trial was described as ''double‐blind'', but it was implied that the study was randomised, we included the trial in a sensitivity analysis. If there was no substantive difference within the primary outcome (see Types of outcome measures) when these ''implied randomisation'' studies were added, we included these studies in the final analysis. If there was a substantive difference, we only analysed clearly randomised trials and described the results of the sensitivity analysis in the text.'
