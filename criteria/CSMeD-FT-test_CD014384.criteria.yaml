# Auto-derived from CSMeD-FT test metadata for CD014384 (Cochrane eligibility sections).
criteria:
- id: study_design
  question: 'Cochrane review: "Antipsychotic dose reduction compared to dose continuation for people with schizophrenia". Does this record meet the review''s eligible study design? Review criterion: We considered all relevant randomised controlled trials (RCTs) for inclusion. If a trial was described as ''double‐blind'', but randomisation was implied, we would include such trials and examine the effect of their inclusion by excluding them in a sensitivity analysis (see Sensitivity analysis). If their inclusion did not result in a substantive difference, they would remain in the analyses. If their inclusion resulted in important clinically significant but not necessarily statistically significant differences, we would not add the data from these lower‐quality studies to the results of the high‐quality trials, but would present such data within a subcategory. We excluded quasi‐RCTs, such as those allocating by alternate days of the week. Where studies had multiple publications, we collated the reports of the same study so that each study, rather than each report, was the unit of interest for the review; such studies have a single identifier with multiple references.'
  required: true
- id: population
  question: 'Cochrane review: "Antipsychotic dose reduction compared to dose continuation for people with schizophrenia". Does this record study the review''s eligible participants/population? Review criterion: Adults, however defined, with schizophrenia or related disorders, including schizophreniform disorder, schizoaffective disorder, and delusional disorder, by any means of diagnosis (irrespective of the diagnostic criteria used), who were stabilised on their current antipsychotic treatment, irrespective of age, gender, race, or country. We accepted any definition of stability that was used in the individual studies. We excluded studies that addressed the question of the minimum effective acute phase dose for acutely ill people with schizophrenia. We were interested in ensuring that information is relevant to the current care of people with schizophrenia, therefore we have highlighted the current clinical state clearly (early postacute, partial remission, remission), as well as the stage (first episode, early illness, persistent), and whether the studies focused primarily on people with particular problems (e.g. negative symptoms, treatment‐resistant illnesses). See Subgroup analysis and investigation of heterogeneity.'
  required: true
- id: intervention_or_topic
  question: 'Cochrane review: "Antipsychotic dose reduction compared to dose continuation for people with schizophrenia". Does this record evaluate the review''s eligible intervention / exposure / index test / topic? Review criterion: Any reduction in dose of the current antipsychotic drug licensed in at least one country, irrespective of how it was defined and how fast it was undertaken. We included studies that allowed a gradual dose reduction up to complete withdrawal as long as it was possible to increase the dose if symptoms re‐emerged. We excluded studies where antipsychotics were fully withdrawn in all participants without the possibility to increase doses if necessary. The reason for this is that the aim of this review was to investigate the effect of dose reduction, not of antipsychotic withdrawal. We excluded studies on so‐called ''intermittent treatment'', where medication is more or less abruptly withdrawn from all patients and only restarted if early warning signs of psychosis re‐emerge. We planned to examine the degree of dose reduction in a subgroup analysis. Continuation of the current antipsychotic dose.'
  required: true
