# Auto-derived from CSMeD-FT train metadata for CD010264 (Cochrane eligibility sections).
criteria:
- id: study_design
  question: 'Cochrane review: "Surgical versus non‐surgical treatment for lumbar spinal stenosis". Does this record meet the review''s eligible study design? Review criterion: We considered for inclusion both randomised controlled trials (RCTs) and quasi‐randomised controlled studies comparing surgical procedures versus non‐surgical treatments. Randomised studies are those in which participants are selected truly at random with a computer‐generated sequence used to assign participants, or closed envelopes, block randomisations and similar approaches. Quasi‐randomised studies are those in which the method of allocating participants to treatment is not strictly random, for example, by date of birth, hospital record number or alternation.'
  required: true
- id: population
  question: 'Cochrane review: "Surgical versus non‐surgical treatment for lumbar spinal stenosis". Does this record study the review''s eligible participants/population? Review criterion: We included studies involving adult patients older than 18 years of age, with age stratified in the analysis. We applied no limitations on gender or age. We defined inclusion by both clinical findings and imaging. We defined the symptom and sign complex indicating high confidence in the diagnosis of ''symptomatic LSS'' as either neurogenic claudication or monoradicular or polyradicular symptoms that are neuro‐anatomically consistent with an area of pathological stenosis. We needed images to clearly show congenital or degenerative narrowing, or both, of the spinal canal with displacement or compression or deformity of neural elements. When patients presented with some degree of degenerative spondylolisthesis, we included them only when they also presented with primary neurological claudication or radicular symptoms. We excluded those with non‐specific low back pain and radicular pain secondary to primary pathological conditions other than congenital or degenerative LSS. Excluded conditions were isthmic spondylolisthesis, disc herniation and post‐fracture stenosis. For studies including mixed clinical populations, we contacted study authors to collect data on eligible patients. When we received no answer, or when subgroups were not included, we excluded those studies.'
  required: true
- id: intervention_or_topic
  question: 'Cochrane review: "Surgical versus non‐surgical treatment for lumbar spinal stenosis". Does this record evaluate the review''s eligible intervention / exposure / index test / topic? Review criterion: We included all types of surgical procedures (decompression, spinal fusion, any kind of device or prosthesis) compared with all types of non‐surgical procedures (e.g. exercise, manipulation, mobilisation, physical therapy, drugs, acupuncture, bracing, education and cognitive‐behavioural treatments). We did not group interventions together but separately evaluated the effectiveness of different types of surgical procedures versus different types of non‐surgical interventions.'
  required: true
