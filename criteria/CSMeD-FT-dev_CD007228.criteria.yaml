# Auto-derived from CSMeD-FT dev metadata for CD007228 (Cochrane eligibility sections).
criteria:
- id: study_design
  question: 'Cochrane review: "Structured telephone support or non‐invasive telemonitoring for patients with heart failure". Does this record meet the review''s eligible study design? Review criterion: We include randomised controlled trials (RCTs) comparing heart failure management delivered via structured telephone support or non‐invasive home telemonitoring with usual post‐discharge care for people with heart failure living within the community. We include only RCTs that have been published in full in the peer‐reviewed literature. We excluded any studies that did not report data for any of our outcomes of interest in an extractable format (we contacted authors of each primary study in an attempt to obtain data).'
  required: true
- id: population
  question: 'Cochrane review: "Structured telephone support or non‐invasive telemonitoring for patients with heart failure". Does this record study the review''s eligible participants/population? Review criterion: Adults (aged 18 years and over) of either sex, any age or ethnic group, with a definitive diagnosis of heart failure. Participants may have been recently discharged from an acute‐care setting (including emergency departments and acute assessment units) to home (including a relative''s home but excluding nursing homes or convalescence homes) or they may have been recruited to a study while managed in the community setting. We excluded studies dealing with general cardiac disorders rather than specifically with heart failure.'
  required: true
- id: intervention_or_topic
  question: 'Cochrane review: "Structured telephone support or non‐invasive telemonitoring for patients with heart failure". Does this record evaluate the review''s eligible intervention / exposure / index test / topic? Review criterion: Structured telephone support or non‐invasive telemonitoring interventions needed to be scheduled, as opposed to offering telephone follow‐up on an ''as needed'' basis. The intervention must have been initiated by a healthcare professional (medical, nursing, social work, pharmacist) and delivered to people with heart failure living in the community as the only aftercare intervention, without protocol‐driven home visits or intensified clinic follow‐up. The intervention had to be targeted at the person and intended to address their concerns and problems, not those of caregivers. The participant must not have been visited at home by a specialised heart failure healthcare professional or study personnel for the purpose of education or clinical assessment other than as an initiation visit to set up equipment. ''Usual care'' consisted of standard post‐discharge care without intensified attendance at cardiology clinics or clinic‐based heart failure disease management programme, or home visiting as described above. We excluded studies if there was any previous exposure to telemonitoring or structured telephone support for the usual care or intervention arms prior to the start of the study.'
  required: true
