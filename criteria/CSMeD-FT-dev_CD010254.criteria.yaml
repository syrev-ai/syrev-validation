  question: 'Cochrane review: "Rosuvastatin for lowering lipids". Does this record meet the review''s eligible study design? Review criterion: Randomized placebo‐controlled trials (RCTs) as well as uncontrolled before‐and after‐trials. Before‐and after‐trials were included because it has been shown that there is no placebo effect of statins on lipid parameters and that a placebo control for these outcomes is not essential (Tsang 2002). Cross‐over trials were included if the outcomes were reported for the parallel arms prior to the cross‐over.'
  required: true
- id: population
  question: 'Cochrane review: "Rosuvastatin for lowering lipids". Does this record study the review''s eligible participants/population? Review criterion: Participants could be of any age with, and without, evidence of cardiovascular disease. Participants could can have normal lipid parameters or any type of hyperlipidaemia or dyslipidaemia (conditions involving high levels of lipids in the blood). We also allowed the inclusion of participants with various co‐morbid conditions including type 2 diabetes mellitus, hypertension, metabolic syndrome (combination of medical disorders that increase risk for cardiovascular disease and diabetes), chronic renal failure or cardiovascular disease.'
  required: true
- id: intervention_or_topic
  question: 'Cochrane review: "Rosuvastatin for lowering lipids". Does this record evaluate the review''s eligible intervention / exposure / index test / topic? Review criterion: Rosuvastatin had to be administered at a constant daily dose compared with placebo, or alone for a period of three to 12 weeks. This administration period was chosen to allow at least three weeks for a steady‐state effect of rosuvastatin to occur, and to be short enough to minimize participant drop outs. Data from studies where rosuvastatin was administered in the morning, or evening, or where it was not specified were accepted. Trials required a washout baseline dietary stabilization period of at least three weeks where all previous lipid‐altering medication was withdrawn. This baseline phase ensures that participants follow a standard lipid‐regulating diet, and helps to stabilize baseline lipid values prior to treatment. Baseline dietary stabilization periods were not required in trials where participants were not receiving lipid‐altering medications or dietary supplements before receiving the test drug.'
