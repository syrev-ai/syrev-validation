  question: 'Cochrane review: "Cerebrolysin for acute ischaemic stroke". Does this record study the review''s eligible participants/population? Review criterion: People with acute ischaemic stroke, irrespective of age, sex, or social status, whose symptom onset was less than 48 hours previously. Stroke symptoms include: sudden weakness or numbness of the face, arm, or leg, often unilateral; confusion; difficulties in speaking or seeing with one or both eyes; difficulties walking; loss of balance or co‐ordination; severe no‐cause headache; fainting or loss of consciousness. Stroke diagnosis confirmation with neuroimaging was not an inclusion criterion. For future updates stroke diagnosis confirmation by neuroimaging will be mandatory.'
