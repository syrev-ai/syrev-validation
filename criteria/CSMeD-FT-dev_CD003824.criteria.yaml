# Auto-derived from CSMeD-FT dev metadata for CD003824 (Cochrane eligibility sections).
criteria:
- id: study_design
  question: 'Cochrane review: "Blood pressure‐lowering efficacy of monotherapy with thiazide diuretics for primary hypertension". Does this record meet the review''s eligible study design? Review criterion: Study design must meet the following criteria: placebo‐controlled; random allocation to thiazide diuretic group and parallel placebo group; duration of follow‐up of at least three weeks; office blood pressure measurement at baseline (following wash‐out) and at one or more time points between 3 and 12 weeks after starting treatment. We included data from cross‐over trials if the authors reported data for the initial treatment period versus the parallel placebo control group followed by an adequate wash‐out period before crossing over to the other active treatment and if data were reported in a similar manner during the second treatment period. We excluded any of the following: non‐randomized trials; single‐blind as well as open‐label trials; trials using a thiazide diuretic in combination with other classes of drugs as first‐line treatment; abstracts without a complete trial report; trials reporting placebo blood pressure levels following a wash‐out period and comparing them with the treatment levels following randomization; and trials in patients with secondary causes of hypertension.'
  required: true
- id: population
  question: 'Cochrane review: "Blood pressure‐lowering efficacy of monotherapy with thiazide diuretics for primary hypertension". Does this record study the review''s eligible participants/population? Review criterion: Adults (18 years or older) with a baseline systolic blood pressure of at least 140 mmHg or a diastolic blood pressure of at least 90 mmHg, measured in a standard way. We excluded trials in which patients had significant renal insufficiency and a documented serum creatinine level more than 1.5 times the normal range from analysis. Participants were not further restricted by age, sex, cardiovascular baseline risk or any other co‐morbid conditions.'
  required: true
- id: intervention_or_topic
  question: 'Cochrane review: "Blood pressure‐lowering efficacy of monotherapy with thiazide diuretics for primary hypertension". Does this record evaluate the review''s eligible intervention / exposure / index test / topic? Review criterion: We included monotherapy with any of the following thiazide and thiazide‐like diuretics: bendroflumethiazide, buthiazide, chlorthalidone, chlorothiazide, clopamide, clorexolone, cyclopenthiazide, cyclothiazide, diapamide, fenquizone, hydrochlorothiazide, hydroflumethiazide, indapamide, isodapamide, mefruside, methyclothiazide, metolazone, polythiazide, quinethazone, trichlormethiazide and xipamide. These drugs are referred to as ''thiazide diuretics'' in this review for simplicity. We did not include data from trials in which the thiazide was titrated to a higher dose in a subset of randomized patients to achieve target blood pressure levels because dose‐response relationships cannot be analyzed if patients within each randomized group are taking different doses of the same drug. If all the patients in the trial were given a forced titrated dose irrespective of the blood pressure recorded, then we included the trial under the highest dose given. Potassium supplementation was allowed in patients with low serum potassium levels.'
  required: true
