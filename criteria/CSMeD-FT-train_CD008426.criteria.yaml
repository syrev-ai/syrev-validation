  question: 'Cochrane review: "House dust mite reduction and avoidance measures for treating eczema". Does this record meet the review''s eligible study design? Review criterion: Randomised controlled trials (RCTs) that assess the efficacy of any of the house dust mite reduction and avoidance measures for the treatment of eczema. We included trials that allowed co‐treatments. We excluded quasi‐randomised trials. We would have included cross‐over trials, only if the data at the end of the first period were available, because of the possibility of treatment carry‐over effects, but we did not identify any for inclusion. We would have included cluster‐randomised trials but identified none for inclusion. We excluded trials on house dust mite reduction and avoidance measures for the prevention of eczema.'
