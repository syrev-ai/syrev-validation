  question: 'Cochrane review: "Melatonin for the promotion of sleep in adults in the intensive care unit". Selection criteria: We included randomized and quasi-randomized controlled trials with adult participants (over the age of 16) admitted to the ICU with any diagnoses given melatonin versus a comparator to promote overnight sleep. We included participants who were mechanically ventilated and those who were not mechanically ventilated. We planned to include studies that compared the use of melatonin, given at an appropriate clinical dose with the intention of promoting night-time sleep, against no agent; or against another agent administered specifically to promote sleep. Question: does this record meet the review''s eligible study design?'
