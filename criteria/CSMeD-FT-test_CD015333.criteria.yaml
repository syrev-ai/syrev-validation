  question: 'Cochrane review: "Non‐pharmacological interventions for persistent postural‐perceptual dizziness (PPPD)". Does this record meet the review''s eligible study design? Review criterion: We included randomised controlled trials (RCTs) and quasi‐randomised trials (where trials were designed as RCTs, but the sequence generation for allocation of treatment used methods such as alternate allocation, birth dates etc). If cross‐over trials were identified then these would have been included, providing the data were reported in an appropriate way to be included in the meta‐analysis. If cluster‐RCTS were identified then they would also have been eligible for inclusion, providing we could appropriately account for the clustering in the data analysis. We included studies reported as full‐text, those published as conference abstracts only and unpublished data. For studies to obtain accurate estimates of effect for different interventions, we considered that follow‐up of participants should last at least three months, as the interventions may take some time to take effect, and this is a chronic illness, whereas short‐term follow‐up may not accurately represent the longer‐term outcome for patients. Studies that followed up participants for less than three months were excluded from the review.'
