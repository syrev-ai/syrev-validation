  question: 'Cochrane review: "Management of faecal incontinence and constipation in adults with central neurological diseases". Does this record study the review''s eligible participants/population? Review criterion: People 18 years of age or more with a central neurological disease and symptoms of faecal incontinence or constipation. Neurological diseases are defined here as any disease with a pathological process directly and chronically affecting the central nervous system (post‐traumatic, degenerative, ischaemic or neoplastic), such as multiple sclerosis, spinal cord injury, cerebrovascular diseases, Parkinson''s disease and Alzheimer''s disease. Acute conditions with no chronic legacy are not included, nor are diseases affecting only the peripheral nervous system, whether involving the motor, sensory or autonomic nerves (for example pelvic floor neuropathy). Faecal incontinence is defined as recurrent uncontrolled, involuntary, or unplanned passage of faecal material or flatus, for at least one month (Whitehead 1999). It causes staining, soiling or leakage onto underwear or a pad. Constipation is defined as having two or more of the following: straining during at least 25% of defecations, lumpy or hard stools, sensation of incomplete evacuation, sensation of ano‐rectal obstruction or blockage, or use of manual manoeuvres to facilitate evacuation in at least 25% of defecations (for example digital evacuation, support of the pelvic floor), and fewer than three defecations a week. Loose stools should rarely be present without the use of laxatives. These criteria should have been fulfilled for the last three months prior to diagnosis, with symptom onset at least six months prior to diagnos'
