  question: 'Cochrane review: "Management of faecal incontinence and constipation in adults with central neurological diseases". Does this record evaluate the review''s eligible intervention / exposure / index test / topic? Review criterion: Any types of conservative management, anal irrigation or surgical management of bowel dysfunction in people with central neurological diseases were considered. Conservative measures included dietary manipulation, oral drug or rectal evacuation therapy (for example enemas or suppositories), bowel training programmes, and assistive techniques (for example abdominal massage, Valsalva manoeuvre, digital rectal stimulation, manual evacuation). Combinations of these interventions in specific bowel programmes were also considered. Bowel irrigation per anus was included under conservative management. Surgical measures included antegrade colonic enema (Malone procedure), percutaneous endoscopic colostomy (PEC), stoma formation, sphincter reconstruction, and sacral nerve stimulation.'
