  question: 'Cochrane review: "Systematic versus opportunistic risk assessment for the primary prevention of cardiovascular disease". Does this record study the review''s eligible participants/population? Review criterion: Healthy adults (aged 18 years or over) from the general population, including those at moderate to high risk of CVD. The review focuses on the primary prevention of CVD, so we have included RCTs covering participants without known CVD (i.e. without myocardial infarction (MI), stroke, revascularisation procedure (coronary artery bypass grafting (CABG) or percutaneous transluminal coronary angioplasty (PTCA)), angina or angiographically‐defined coronary heart disease (CHD)). We were interested only in primary prevention of CVD, i.e. the effects of CVD risk assessment on healthy individuals or those at increased risk of CVD, because if an individual is already diagnosed with CHD, they are already considered at high risk and cared for by the healthcare system (e.g. put on medication, given active lifestyle change advice, etc.). Previous research has shown that there are a considerable number of individuals who are at high risk of, or already have, CVD who are not recognised/diagnosed; hence, the introduction of screening programmes in the UK such as the Health Checks (DH 2008a).'
