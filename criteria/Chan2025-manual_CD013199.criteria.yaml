# Auto-derived from the [SEL] selection criteria shipped with Chan 2025 manual-search data for CD013199.
criteria:
- id: study_design
  question: 'Cochrane review: "Halo sign on temporal artery ultrasound versus temporal artery biopsy for giant cell arteritis". Selection criteria: We included all participants with clinically suspected GCA who were investigated for the presence of the halo sign on temporal artery US, using the ACR 1990 criteria as a reference standard. We included studies with participants with a prior diagnosis of polymyalgia rheumatica. We excluded studies if participants had had two or more weeks of steroid treatment prior to the investigations. We also included any comparative test accuracy studies of the halo sign on temporal artery US versus TAB, with use of the 1990 ACR diagnostic criteria as a reference standard. Although we have chosen to use this classification for the purpose of the meta‐analysis, we accept that it incorporates unavoidable incorporation bias, as TAB is itself one of the five criteria. This increases the specificity of TAB, making it difficult to compare with US. We excluded case‐control studies, as they overestimate accuracy, as well as case series in which all participants had a prior diagnosis of GCA, as they can only address sensitivity and not specificity. Question: does this record meet the review''s eligible study design?'
  required: true
