  question: 'Cochrane review: "Lifestyle and dietary interventions for Ménière’s disease". Does this record meet the review''s eligible study design? Review criterion: We included randomised controlled trials (RCTs) and quasi‐randomised trials (where trials were designed as RCTs, but the sequence generation for allocation of treatment used methods such as alternate allocation, birth dates etc). Ménière''s disease is known to fluctuate over time, which may mean that cross‐over trials are not an appropriate study design for this condition. However, no cross‐over RCTs or cluster‐RCTs were identified as relevant for inclusion in this review. We included studies reported as full‐text, those published as conference abstracts only and unpublished data. Ménière''s disease is characterised by episodic balance disturbance ‐ the frequency of attacks may change over time (Huppert 2010). For studies to obtain accurate estimates of the effect of different interventions, we considered that follow‐up of participants should be for at least three months ‐ to ensure that participants are likely to have experienced a number of attacks during the follow‐up period. Studies that followed up participants for less than three months were excluded from the review.'
