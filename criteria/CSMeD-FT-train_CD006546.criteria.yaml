# Auto-derived from CSMeD-FT train metadata for CD006546 (Cochrane eligibility sections).
criteria:
- id: study_design
  question: 'Cochrane review: "Kinship care for the safety, permanency, and well‐being of children removed from the home for maltreatment". Does this record meet the review''s eligible study design? Review criterion: Controlled experimental and quasi‐experimental studies, in which children placed in kinship care are compared cross‐sectionally or longitudinally with children placed in foster care. The types of eligible quasi‐experimental designs include studies that employ matching, covariates, or ex post facto comparisons of children in kinship care and foster care. Studies that compare kinship care to more restrictive out‐of‐home settings (e.g., residential treatment centres) were not considered for this review. Relative to children who are placed in kinship or foster care, children placed in more restrictive settings tend to differ in important ways. These differences complicate inferences about the effects of placement and as such, the review focuses on kinship and foster care placements only.'
  required: true
- id: population
  question: 'Cochrane review: "Kinship care for the safety, permanency, and well‐being of children removed from the home for maltreatment". Does this record study the review''s eligible participants/population? Review criterion: Children and youth under the age of 18 who were removed from the home for abuse, neglect, or other maltreatment, and subsequently placed in kinship care.'
  required: true
- id: intervention_or_topic
  question: 'Cochrane review: "Kinship care for the safety, permanency, and well‐being of children removed from the home for maltreatment". Does this record evaluate the review''s eligible intervention / exposure / index test / topic? Review criterion: Formal kinship care placements, irrespective of whether the kin caregivers were licensed (paid) or unlicensed (unpaid). Thus, studies that exclusively examine informal or private kinship care arrangements were not considered. Studies were considered if participants experienced other placement types in conjunction with the kinship care intervention. For example, the treatment group may include children for whom kinship care was their first, last, or only placement in out‐of‐home care. However, these children must have spent the majority (i.e., more than 50%) of their total time in out‐of‐home care in kinship care.'
  required: true
