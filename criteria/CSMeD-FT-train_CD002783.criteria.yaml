  question: 'Cochrane review: "Thrombolytic strategies versus standard anticoagulation for acute deep vein thrombosis of the lower limb". Does this record meet the review''s eligible study design? Review criterion: We included all randomised controlled trials (RCTs) of thrombolysis (with or without adjunctive clot removal strategies) and anticoagulation, versus anticoagulation alone, for acute lower limb DVT. Any method of randomisation was eligible, and differences in methodological quality were taken into account in the analysis. Trials that were not analysed on an intention‐to‐treat (ITT) basis were included, provided investigators accounted for all randomised participants.'
