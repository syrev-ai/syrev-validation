  question: 'Cochrane review: "Thrombolytic strategies versus standard anticoagulation for acute deep vein thrombosis of the lower limb". Does this record study the review''s eligible participants/population? Review criterion: We included trials of adult (aged 18 and over) participants with acute DVT, defined as onset of symptoms within seven days and confirmed by objective testing with, for example, venography or duplex ultrasonography. Trials including participants with chronic or recurrent venous thrombosis were excluded, as were those with participants commencing treatment after a maximum of 21 days from the onset of symptoms. Trials including participants with arm vein thrombosis were included in the update when the majority of cases affected the lower limb.'
  required: true
- id: intervention_or_topic
  question: 'Cochrane review: "Thrombolytic strategies versus standard anticoagulation for acute deep vein thrombosis of the lower limb". Does this record evaluate the review''s eligible intervention / exposure / index test / topic? Review criterion: We included trials with the use of any thrombolytic agent, the principal ones being streptokinase, urokinase and tissue plasminogen activator (tPA); other agents were included if used for the treatment of acute DVT. All routes of drug lysis administration were considered, as were different dosing regimens of lytic agents. These included systemic and catheter‐directed thrombolysis (CDT) methods. As combinations of clot removal strategies are now frequently used in clinical practice, we also included studies where adjunctive thrombus removal techniques such as thrombectomy, balloon maceration, balloon venoplasty, aspiration, stenting etc, were used in combination with thrombolysis, provided they were compared to standard anticoagulation alone.'
