  question: 'Cochrane review: "Dietary fibre for the primary prevention of cardiovascular disease". Does this record evaluate the review''s eligible intervention / exposure / index test / topic? Review criterion: We included trials comparing dietary fibre with no intervention or minimal intervention (for example leaflets with no person‐to‐person intervention or reinforcement). The intervention was in the form of advice to increase consumption or the provision of fibre supplements or high‐fibre foods. Where we found a sufficient number of trials, we stratified results by the type of fibre (soluble or insoluble), dose of supplementation, duration of intervention, and type of intervention (advice, diet, or supplementation). We excluded multi‐factorial lifestyle intervention trials and trials focused on weight loss in order to avoid confounding. We also focused on follow‐up periods of 12 weeks (or three months) or more, as longer follow‐up periods are more relevant for public health interventions.'
