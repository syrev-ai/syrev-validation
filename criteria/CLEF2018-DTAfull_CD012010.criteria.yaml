criteria:
- id: study_design
  question: 'Cochrane review: "Serum amylase and lipase and urinary trypsinogen and amylase for diagnosis of acute pancreatitis". Selection criteria: We included all studies that evaluated the diagnostic test accuracy of serum amylase, serum lipase, urinary trypsinogen-2, and urinary amylase for the diagnosis of acute pancreatitis. We excluded case-control studies because these studies are prone to bias. We accepted any of the following reference standards: biopsy, consensus conference definition, radiological features of acute pancreatitis, diagnosis of acute pancreatitis during laparotomy or autopsy, and organ failure. At least two review authors independently searched and screened the references located by the search to identify relevant studies. Question: does this record meet the review''s eligible study design?'
