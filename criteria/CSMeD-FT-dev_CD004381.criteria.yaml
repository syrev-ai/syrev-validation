  question: 'Cochrane review: "Music therapy for autistic people". Does this record study the review''s eligible participants/population? Review criterion: Individuals of any age who were diagnosed with ASD as defined in DSM‐5 (APA 2013) or ICD‐11 (WHO 2021) criteria, whether identified by a psychological assessment or a psychiatric diagnosis, were considered for inclusion. Moreover, we included individuals diagnosed with pervasive developmental disorders, as defined in ICD‐10 criteria (WHO 1994) or in previous versions of the DSM, including childhood autism, atypical autism, Asperger''s syndrome, and pervasive developmental disorder not otherwise specified, as these previous diagnostic labels are now included in the category of ASD in DSM‐5 and ICD‐11. Individuals with Rett''s disorder or childhood disintegrative disorder were not included as they have been excluded from the ASD diagnostic category in the current classifications, given their significantly different clinical course.'
