  question: 'Cochrane review: "Non‐steroidal anti‐inflammatory drugs (NSAIDs) for axial spondyloarthritis (ankylosing spondylitis and non‐radiographic axial spondyloarthritis)". Does this record study the review''s eligible participants/population? Review criterion: We selected studies that included adults aged ≥ 18 years with a clinical diagnosis of axSpA, or patients fulfilling modified New York criteria or ASAS axial SpA criteria, including nr‐axSpA and AS. We included both disease subgroups. Studies containing patients with other diagnoses (e.g. trials that included participants based upon fulfilment of the European Spondyloarthropathy Study Group (ESSG) criteria or the Amor criteria (Amor 1990)) were only eligible if they presented results from patients with axSpA separately (Dougados 1991).'
