  question: 'Cochrane review: "Non‐steroidal anti‐inflammatory drugs (NSAIDs) for axial spondyloarthritis (ankylosing spondylitis and non‐radiographic axial spondyloarthritis)". Does this record meet the review''s eligible study design? Review criterion: We included all published randomised controlled trials (RCTs) and quasi‐RCTs (i.e. where allocation was not truly random). We included only trials that were published as full articles or were available as a full trial report. Extension phases and post‐hoc analyses of RCTs were also included to enable a comprehensive overview of the benefits and harms of NSAIDs. As radiographic progression, as well as long term harmful effects, were unlikely to be assessed in short‐term RCTs of NSAIDs, we also included observational cohort studies to investigate the effect of NSAIDs on these outcomes. We assessed all included studies in an assessment of adverse events/harms of therapy with NSAIDs. In addition, cohort studies assessing the effect of NSAIDs on radiographic progression had to have a minimum duration of six months in order to be included. There were no restrictions on language of the paper.'
  required: true
