- id: study_design
  question: 'Cochrane review: "Dopamine transporter imaging for the diagnosis of dementia with Lewy bodies". Does this record meet the review''s eligible study design? Review criterion: (a) Test accuracy studies with delayed verification. (b) Diagnostic case‐control studies. This applied to objective A only. These may be true case‐control studies, conducted retrospectively, in which participants who underwent DAT imaging in life are included on the basis of the presence or absence of a neuropathological diagnosis of DLB at autopsy. We anticipated that a more common design would be studies in which participants were selected for inclusion on the basis of their clinically defined DLB diagnostic status. ''Cases'' would meet clinical criteria (excluding the DAT imaging criterion) for probable DLB; ''controls'' would not meet these criteria but would meet clinical criteria for one or more other subtypes of dementia. There is no universally agreed term for these studies, but they have been called ''two‐gate designs with alternative diagnosis controls'' (Rutjes 2005). These study designs were eligible for inclusion but would, if possible, be the subject of sensitivity analysis because of the risk of spectrum bias they entail.'
  required: true
- id: population
  question: 'Cochrane review: "Dopamine transporter imaging for the diagnosis of dementia with Lewy bodies". Does this record study the review''s eligible participants/population? Review criterion: Objective A: Participants with dementia in secondary care settings. Dementia should have been diagnosed using validated clinical criteria (for example ICD, DSM). Studies that specifically excluded subjects meeting criteria for dementias other than DLB or AD (for example vascular dementia) could also be included. Objective B: Participants meeting clinical criteria (other than the DAT imaging criterion) for possible or probable DLB, or both. We considered this to be the most useful test of utility in clinical practice, where DAT imaging is likely to be used in addition to clinical assessment. A population meeting clinical criteria for probable DLB will already have missed many true DLB cases (because of the relatively poor sensitivity), and the opportunity for adding diagnostic value is limited (because of the already high specificity). Hence, the potential clinical utility of the test is greatest if applied to a population meeting the more sensitive but less specific criteria for possible DLB. However, participants meeting probable DLB criteria could also be included; we would examine this as a potential source of heterogeneity. We excluded participants with Parkinson''s disease or other Parkinsonian syndromes known to be associated with abnormal DAT imaging.'
  required: true
