# Auto-derived from Selection criteria of 10.1002/14651858.cd012342.pub2 (2018) via Europe PMC.
criteria:
- id: study_design
  question: 'Cochrane review: "Comparison of a therapeutic‐only versus prophylactic platelet transfusion policy for people with congenital or acquired bone marrow failure disorders". Selection criteria: We included RCTs, non-RCTs, and CBAs that involved the transfusion of platelet concentrates (prepared either from individual units of whole blood or by apheresis any dose, frequency, or transfusion trigger) and given to treat or prevent bleeding among people with congenital or acquired bone marrow failure disorders.We excluded uncontrolled studies, cross-sectional studies, and case-control studies. We excluded cluster-RCTs, non-randomised cluster trials, and CBAs with fewer than two intervention sites and two control sites due to the risk of confounding. We included all people with long-term bone marrow failure disorders that require platelet transfusions, including neonates. We excluded studies of alternatives to platelet transfusion, or studies of people receiving intensive chemotherapy or a stem cell transplant. Question: does this record meet the review''s eligible study design?'
  required: true
