# Auto-derived from Selection criteria of 10.1002/14651858.cd010680.pub2 (2016) via Europe PMC.
criteria:
- id: study_design
  question: 'Cochrane review: "Ankle brachial index for the diagnosis of lower limb peripheral arterial disease". Selection criteria: We included cross-sectional studies of ABI in which duplex ultrasonography or angiography was used as the reference standard. We also included cross-sectional or diagnostic test accuracy (DTA) cohort studies consisting of both prospective and retrospective studies.Participants were adults presenting with leg pain on walking that was relieved by rest, who were tested in primary care settings or secondary care settings (hospital outpatients only) and who did not have signs or symptoms of critical limb ischaemia (rest pain, ischaemic ulcers or gangrene).The index test was ABI, also called the ankle brachial pressure index (ABPI) or the Ankle Arm Index (AAI), which was performed with a hand-held doppler or oscillometry device to detect ankle vessels. We included data collected via sphygmomanometers (both manual and aneroid) and digital equipment. Question: does this record meet the review''s eligible study design?'
  required: true
