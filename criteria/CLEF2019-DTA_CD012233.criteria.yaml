- id: study_design
  question: 'Cochrane review: "Transabdominal ultrasound and endoscopic ultrasound for diagnosis of gallbladder polyps". Selection criteria: Studies reporting on the diagnostic accuracy data (true positive, false positive, false negative and true negative) of the index test (TAUS or EUS or both) for detection of gallbladder polyps, differentiation between true and pseudo polyps, or differentiation between dysplastic polyps/carcinomas and adenomas/pseudo polyps. We only accepted histopathology after cholecystectomy as the reference standard, except for studies on diagnosis of gallbladder polyp. For the latter studies, we also accepted repeated imaging up to six months by TAUS or EUS as the reference standard. Question: does this record meet the review''s eligible study design?'
