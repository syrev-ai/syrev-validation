# Auto-derived from CSMeD-FT train metadata for CD009537 (Cochrane eligibility sections).
criteria:
- id: study_design
  question: 'Cochrane review: "Interventions for preventing delirium in older people in institutional long‐term care". Does this record meet the review''s eligible study design? Review criterion: We included randomised controlled trials (RCTs) and cluster‐RCTs in this review. Eligible trials investigated interventions for preventing delirium in older people in LTC. It is possible that any general health intervention for older people in LTC will have the effect of reducing delirium. Therefore, we only considered trials that used a validated method of delirium diagnosis, such as DSM‐5 and International Classification of Diseases 10th Edition (ICD‐10) (APA 2013; WHO 1992), or a diagnostic tool validated against these, for example, Confusion Assessment Method (CAM) (Inouye 1990), and Delirium Rating Scale (DRS) (Trzepacz 1988).'
  required: true
- id: population
  question: 'Cochrane review: "Interventions for preventing delirium in older people in institutional long‐term care". Does this record study the review''s eligible participants/population? Review criterion: We included trials in which participants were residents of LTC facilities and in which the mean participant age was 65 years or older. In this review, LTC was defined as an institution that was the permanent residence of an individual, providing accommodation together with personal or nursing care. We excluded trials taking place in other settings, such as hospitals, palliative care settings and settings that were not the permanent residence of study participants (e.g. postacute care, intermediate care, continuing care).'
  required: true
- id: intervention_or_topic
  question: 'Cochrane review: "Interventions for preventing delirium in older people in institutional long‐term care". Does this record evaluate the review''s eligible intervention / exposure / index test / topic? Review criterion: Experimental interventions were any interventions designed to prevent delirium in LTC settings. These could have been single‐ or multicomponent, pharmacological or non‐pharmacological. Comparator interventions were standard care for non‐pharmacological interventions (defined as the usual care provided on that unit), or placebo for pharmacological interventions. These interventions are described as complex interventions. Complex interventions contain characteristics of different complexities, including; number of interacting components, number and variability of outcomes, the degree of flexibility in delivering the intervention and the number of organisational levels targeted by the intervention (Campbell 2000).'
  required: true
