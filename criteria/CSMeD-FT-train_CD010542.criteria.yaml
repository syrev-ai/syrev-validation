- id: study_design
  question: 'Cochrane review: "Transient elastography for diagnosis of stages of hepatic fibrosis and cirrhosis in people with alcoholic liver disease". Does this record meet the review''s eligible study design? Review criterion: We sought to include diagnostic cohort studies and diagnostic case‐control studies that had assessed hepatic fibrosis in participants with alcoholic liver disease through transient elastography and liver biopsy, irrespective of language or publication status, or whether data were collected prospectively or retrospectively. We considered studies for inclusion also if they had included participants with different aetiologies of liver disease.'
  required: true
- id: population
  question: 'Cochrane review: "Transient elastography for diagnosis of stages of hepatic fibrosis and cirrhosis in people with alcoholic liver disease". Does this record study the review''s eligible participants/population? Review criterion: The studies had to include participants of any sex and ethnic origin, above 16 years old, and diagnosed with alcoholic liver disease. The participants could have been hospitalised or managed as outpatients. The diagnosis of alcoholic liver disease in the study participants had to be established based on registered history of excessive intake of alcohol of sufficient duration and quantity together with clinical evidence of liver disease expressed with physical signs at examination and followed by laboratory evidence of liver disease. To ascertain the diagnosis of alcoholic liver disease and study the presence or absence of hepatic fibrosis or cirrhosis, the studies had to perform both transient elastography and liver biopsy (Bouchier 1992). For this review, we did not consider for inclusion data on participants diagnosed with alcoholic liver disease and having a concomitant liver disease such as non‐alcoholic fatty liver disease, chronic hepatitis C virus infection, chronic hepatitis B virus infection, autoimmune liver disease, or human immunodeficiency virus (HIV) infection. We extracted data on study participants with alcoholic liver disease alone whenever such data were available in the study report or whenever we could obtain the data required for the review through personal communication with study authors. In the latter case, we disregarded some of the data presented in the publication and used the data provided by the study authors through personal communication.'
  required: true
- id: intervention_or_topic
  question: 'Cochrane review: "Transient elastography for diagnosis of stages of hepatic fibrosis and cirrhosis in people with alcoholic liver disease". Does this record evaluate the review''s eligible intervention / exposure / index test / topic? Review criterion: Transient elastography, a non‐invasive test measuring liver stiffness in kiloPascals (kPa). Following the recommended technical parameters for transient elastography and to ensure the validity of the transient elastography result for every participant in the single studies, participants should have undergone at least 10 validated stiffness measurements at the same measurement point. The measurements should have had an interquartile range of 30% or less, and the ratio of the number of successful measurements to the total number of acquisitions should have been 60% or less (Echosens 2009). We only considered data from people who provided the full set of the described data. Transient elastography is not recommended for use in pregnant women, people with pacemakers, and people with ascites. Factors that may influence the success of transient elastography investigation are experience of the operator and body mass index of the person. Liver stiffness measurement can produce biased results depending on the grade of necro‐inflammation and grade of steatosis (Myers 2010).'
  required: true
