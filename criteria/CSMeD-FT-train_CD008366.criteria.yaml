  question: 'Cochrane review: "Community wide interventions for increasing physical activity". Does this record evaluate the review''s eligible intervention / exposure / index test / topic? Review criterion: It is recognised that to achieve a whole of community approach requires more than a singular strategy, as changing behaviour is a difficult task (Mummery 2009). Although little is known about how to reach the most disadvantaged groups in the community (Mummery 2009), we defined a community wide approach as one which should include strategies that have, within their scope, outreach to many disadvantaged groups. For this review, we defined a community wide intervention as one which has at least two of the following six broad strategies aimed at physical activity. The list categories of suitable strategies, which would be components of an integrated community wide intervention, are consistent with the logic model. 1. Social marketing through local mass media (e.g. television (TV), radio, newspapers). 2. Other communication strategies (e.g. posters, flyers, information booklets, websites, maps) to raise awareness of the project and provide specific information to individuals in the community. 3. Individual counselling by health professionals (both publicly and privately funded), such as the use of physical activity prescriptions. 4. Working with voluntary, government and non‐government organisations, including sporting clubs, to encourage participation in walking, other activities and events. 5. Working within specific settings such as schools, workplaces, aged care centres, community centres, homeless shelters, and shopping malls. This may include settings that provide an opport'
