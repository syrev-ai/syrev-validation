  question: 'Cochrane review: "Community wide interventions for increasing physical activity". Does this record meet the review''s eligible study design? Review criterion: It is recognised that public health and health promotion interventions are evaluated using a wide variety of approaches and designs. We permitted the inclusion of cluster randomised controlled trials, randomised controlled trials (RCTs), quasi‐experimental designs which used a control population for comparison, interrupted time‐series (ITS) studies, and prospective controlled cohort studies (PCCS). Only studies with a minimum six‐month follow up from the start of the intervention to measurement of outcomes were included. The six‐month period was considered as the minimal time frame as physical activity behaviour changes, as understood by the Prochaska and DiClemente model (Prochaska 1992), are established in the action stage, which is when the individual actively engages in the new behaviour. For physical activity, the highest likelihood for relapse occurs within the first six months of starting a regular program (Dishman 1994).'
  required: true
