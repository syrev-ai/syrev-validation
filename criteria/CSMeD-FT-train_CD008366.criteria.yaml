  question: 'Cochrane review: "Community wide interventions for increasing physical activity". Does this record study the review''s eligible participants/population? Review criterion: The term community wide generally refers to either: 1) an intervention directed at a geographic area, such as a city or a town defined by geographical boundaries; or 2) an intervention directed toward groups of people who share at least one common social or cultural characteristic. As the focus of the review was whole‐of‐community interventions, we defined participants in the included studies as comprising those persons of any age residing in a geographically defined community, such as urban, peri‐urban, village, town, or city. We excluded interventions which were whole of state or country. Although some of the strategies targeted individuals with chronic disease, collectively the participants included in the studies needed to be representative of the whole community and not restricted to a particular geographic subregion (for example a park) or subgroups (for example only elderly people). To be included, a strategy must have shown intent to be comprehensive in reaching the targeted community. Participants must have been free living and not part of any institutionalised community, such as those who were mentally ill, the frail or bedridden elderly population, or those incarcerated in prison.'
  required: true
