# Auto-derived from Selection criteria of 10.1002/14651858.cd011912.pub2 (2018) via Europe PMC.
criteria:
- id: study_design
  question: 'Cochrane review: "Pulse oximetry screening for critical congenital heart defects". Selection criteria: We selected studies that met predefined criteria for design, population, tests, and outcomes. We included cross-sectional and cohort studies assessing the diagnostic accuracy of pulse oximetry screening for diagnosis of CCHD in term and late preterm asymptomatic newborn infants. We considered all protocols of pulse oximetry screening (eg, different saturation thresholds to define abnormality, post-ductal only or pre-ductal and post-ductal measurements, test timing less than or greater than 24 hours). Reference standards were diagnostic echocardiography (echocardiogram) and clinical follow-up, including postmortem findings, mortality, and congenital anomaly databases. Question: does this record meet the review''s eligible study design?'
