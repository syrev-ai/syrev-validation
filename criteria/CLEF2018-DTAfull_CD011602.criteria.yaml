  question: 'Cochrane review: "Ultrasonography for diagnosis of alcoholic cirrhosis in people with alcoholic liver disease". Selection criteria: Three review authors independently identified studies for possible inclusion in the review. We excluded references not fulfilling the inclusion criteria of the review protocol. We sent e-mails to study authors.The included studies had to evaluate ultrasound in the diagnosis of hepatic cirrhosis using only liver biopsy as the reference standard.The maximum time interval of investigation with liver biopsy and ultrasonography should not have exceeded six months. In addition, ultrasonography could have been performed before or after liver biopsy. Question: does this record meet the review''s eligible study design?'
