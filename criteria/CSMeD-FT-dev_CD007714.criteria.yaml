- id: intervention_or_topic
  question: 'Cochrane review: "Non‐invasive ventilation during exercise training for people with chronic obstructive pulmonary disease". Does this record evaluate the review''s eligible intervention / exposure / index test / topic? Review criterion: The intervention for the active group consisted of the application of NIV (including bilevel, inspiratory pressure support and proportional assist ventilation) delivered via a mask or mouthpiece during all supervised exercise training sessions. The intervention for the control group was exercise training with or without sham NIV during all supervised exercise training sessions. Studies that involved the delivery of supplemental oxygen during exercise training in one group (e.g. exercise training with NIV and supplemental oxygen) were included provided that supplemental oxygen was also delivered to the alternative group (e.g. exercise training with supplemental oxygen). Similarly, studies that involved the use of nocturnal NIV were included only if both the actively treated group and the control group received nocturnal NIV. Training had to include lower limb and/or upper limb endurance exercise and had to comprise four or more weeks with a minimum of two supervised sessions per week. Studies that used continuous positive airway pressure as the active treatment during exercise training were excluded.'
