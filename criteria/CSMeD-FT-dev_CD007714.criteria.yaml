  question: 'Cochrane review: "Non‐invasive ventilation during exercise training for people with chronic obstructive pulmonary disease". Does this record study the review''s eligible participants/population? Review criterion: We considered studies with participants with stable COPD for inclusion. Participants were considered to be stable if no history of an exacerbation was reported over the past month (Rabe 2007). The definition of COPD was based on: a clinical diagnosis of COPD; and a best recorded ratio of forced expiratory volume during one second (FEV1) over forced vital capacity (FVC) < 70% and a best recorded FEV1 < 80% predicted for individual study participants (equivalent to GOLD stage II to IV) (GOLD 2013). a clinical diagnosis of COPD; and a best recorded ratio of forced expiratory volume during one second (FEV1) over forced vital capacity (FVC) < 70% and a best recorded FEV1 < 80% predicted for individual study participants (equivalent to GOLD stage II to IV) (GOLD 2013). We excluded studies that included participants with non‐COPD respiratory disease or participants with concomitant neuromuscular disease, a restrictive thoracic disorder, significant cardiac failure or cardiac disease if data from participants with COPD could not be analysed separately.'
