  question: 'Cochrane review: "Non‐invasive ventilation during exercise training for people with chronic obstructive pulmonary disease". Does this record meet the review''s eligible study design? Review criterion: We included in this review randomised controlled trials (RCTs) comparing NIV during exercise training versus exercise training alone, or exercise training with sham NIV (control group). Randomised cross‐over trials were also considered for inclusion. Quasi‐RCTs, for example, those with alternate randomisation, were excluded.'
